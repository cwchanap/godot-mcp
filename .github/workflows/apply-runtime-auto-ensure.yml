name: Apply runtime bridge auto-ensure patch

on:
  push:
    branches:
      - feat/runtime-bridge-auto-ensure

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: apply runtime bridge auto-ensure patch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/runtime-bridge-auto-ensure
          fetch-depth: 0

      - name: Apply focused transforms
        run: node scripts/apply-runtime-auto-ensure.mjs

      - name: Remove one-shot patch machinery
        run: |
          git rm .github/workflows/apply-runtime-auto-ensure.yml
          git rm scripts/apply-runtime-auto-ensure.mjs

      - name: Commit transformed files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: wire runtime bridge auto-ensure"
          git push origin HEAD:feat/runtime-bridge-auto-ensure
