name: Review RED verification

on:
  push:
    branches:
      - feat/runtime-bridge-auto-ensure
  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  NODE_VERSION: '20'

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/runtime-bridge-auto-ensure
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Add regression tests and verify RED
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          auto = Path('src/runtime-bridge-auto-ensure.spec.ts')
          text = auto.read_text()

          install_before = """    expect(result).toEqual({
      installed: true,
      version: bridgeVersion,
      compatible: true,
      action: 'installed',
    });"""
          install_after = """    expect(result).toEqual({
      version: bridgeVersion,
      action: 'installed',
    });"""
          if text.count(install_before) != 1:
              raise SystemExit(f'expected 1 install assertion, got {text.count(install_before)}')
          text = text.replace(install_before, install_after)

          updated_before = """    expect(result).toEqual({
      installed: true,
      version: bridgeVersion,
      compatible: true,
      action: 'updated',
    });"""
          if text.count(updated_before) != 2:
              raise SystemExit(f'expected 2 updated result assertions, got {text.count(updated_before)}')
          text = text.replace(updated_before, """    expect(result).toEqual({
      version: bridgeVersion,
      action: 'updated',
    });""")

          old_post = """    await expect(manager.ensureBridge(projectPath)).rejects.toThrow(
      'Runtime bridge preparation did not produce a compatible managed bridge.'
    );"""
          new_post = """    await expect(manager.ensureBridge(projectPath)).rejects.toThrow(
      `Runtime bridge preparation did not produce a compatible managed bridge (installed=true, compatible=false, version=${bridgeVersion}, expected=${bridgeVersion}, path=${bridgeDir}).`
    );"""
          if old_post not in text:
              raise SystemExit('postcondition assertion not found')
          text = text.replace(old_post, new_post)

          anchor = """  it('validates managed assets before installing into a clean project', async () => {
    await rm(path.join(assetsPath, 'runtime_bridge.gd'));
    const manager = new RuntimeControlManager({ runtimeBridgeAssetsDir: assetsPath });

    await expect(manager.ensureBridge(projectPath)).rejects.toThrow(
      'Generated runtime bridge script is missing:'
    );
    await expect(readFile(bridgeScript, 'utf8')).rejects.toMatchObject({ code: 'ENOENT' });
  });
"""
          addition = anchor + """

  it('refuses to mutate the active project bridge outside a controlled restart', async () => {
    const manager = new RuntimeControlManager({ runtimeBridgeAssetsDir: assetsPath });
    await manager.ensureBridge(projectPath);
    await writeFile(bridgeScript, 'corrupted while running');
    await manager.startSession(projectPath);

    try {
      await expect(manager.ensureBridge(projectPath)).rejects.toThrow(
        'Cannot modify runtime bridge while a running session is active for this project.'
      );
      await expect(readFile(bridgeScript, 'utf8')).resolves.toBe('corrupted while running');
    } finally {
      await manager.stopSession();
    }
  });

  it('propagates manifest filesystem errors instead of treating them as incompatibility', async () => {
    const manager = new RuntimeControlManager({ runtimeBridgeAssetsDir: assetsPath });
    await manager.ensureBridge(projectPath);
    await rm(bridgeManifest);
    await mkdir(bridgeManifest);

    await expect(manager.getBridgeStatus(projectPath)).rejects.toMatchObject({ code: 'EISDIR' });
  });
"""
          if anchor not in text:
              raise SystemExit('clean-project test anchor not found')
          text = text.replace(anchor, addition)

          old_call = "expect(runtimeManager.ensureBridge).toHaveBeenCalledWith(projectPath);"
          new_call = "expect(runtimeManager.ensureBridge).toHaveBeenCalledWith(projectPath, { allowActiveSessionMutation: true });"
          if old_call not in text:
              raise SystemExit('run_project ensure expectation not found')
          text = text.replace(old_call, new_call)
          auto.write_text(text)

          manager_spec = Path('src/runtime-control-manager.spec.ts')
          text = manager_spec.read_text()
          old_install = """    const status = await manager.ensureBridge(projectPath);

    expect(status.installed).toBe(true);
    expect(status.version).toBe(bridgeVersion);"""
          new_install = """    const result = await manager.ensureBridge(projectPath);

    expect(result).toEqual({ version: bridgeVersion, action: 'installed' });"""
          if old_install not in text:
              raise SystemExit('manager install result assertion not found')
          text = text.replace(old_install, new_install)

          old_update = """    const status = await manager.ensureBridge(projectPath);

    expect(status).toEqual(expect.objectContaining({
      installed: true,
      version: generatedVersion,
      compatible: true,
    }));"""
          new_update = """    const result = await manager.ensureBridge(projectPath);

    expect(result).toEqual({ version: generatedVersion, action: 'updated' });"""
          if old_update not in text:
              raise SystemExit('manager update result assertion not found')
          text = text.replace(old_update, new_update)
          manager_spec.write_text(text)
          PY

          npm ci >/dev/null
          set +e
          output=$(npx vitest run src/runtime-bridge-auto-ensure.spec.ts src/runtime-control-manager.spec.ts 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo 'Expected regression suite to fail before production fixes' >&2
            exit 1
          fi
          grep -q 'refuses to mutate the active project bridge outside a controlled restart' <<<"$output"
          grep -q 'propagates manifest filesystem errors instead of treating them as incompatibility' <<<"$output"
          grep -q 'rejects a write that does not produce a compatible bridge' <<<"$output"

          git checkout HEAD^ -- .github/workflows/ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/runtime-bridge-auto-ensure.spec.ts src/runtime-control-manager.spec.ts .github/workflows/ci.yml
          git commit -m 'test: cover review edge cases'
          git push origin HEAD:feat/runtime-bridge-auto-ensure
